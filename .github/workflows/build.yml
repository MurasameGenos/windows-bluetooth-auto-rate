name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build .\WindowsBluetoothAutoRate.slnx -c Release
      - name: Publish release layout
        shell: pwsh
        run: .\scripts\Publish-Release.ps1
